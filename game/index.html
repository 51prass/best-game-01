<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUMEN — Keeper of the Last Light</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050b16; }
  #game { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="LUMEN: Keeper of the Last Light. Aim the lighthouse beam with the mouse and hold click to burn back the shadow creatures."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
